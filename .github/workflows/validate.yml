name: Validate static site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check app.js
      - name: JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
      - name: Required pages and assets
        run: |
          test -f index.html
          test -f services.html
          test -f about.html
          test -f events.html
          test -f contact.html
          test -f assets/logo.svg
          test -f assets/shop-front.svg
