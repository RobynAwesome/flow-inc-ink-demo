name: Unpack Flow Inc Ink site

on:
  push:
    branches: [main]
    paths:
      - 'flow-inc-ink-multipage-v3.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack production source
        run: |
          rm -rf .site-unpack
          mkdir .site-unpack
          unzip -q flow-inc-ink-multipage-v3.zip -d .site-unpack
          cp -a .site-unpack/flow-inc-ink-multipage-v3/. .
          rm -rf .site-unpack flow-inc-ink-multipage-v3.zip
      - name: Commit production source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy Flow Inc Ink multipage client build" || exit 0
          git push origin main
